name = "navbase"
main = "./worker/index.js"
compatibility_date = "2026-09-24"

# 让 worker 以文本形式 import 根目录 schema.sql（单一数据源，避免 SQL 双份维护）；
# fallthrough = true：未匹配本规则的模块回落到 wrangler 默认 Text 规则（.txt/.html），
# 否则启动时会有 "does not have a fallback" 警告
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 必须全量 true：glob 大小写敏感，数组形态（如 ["/api/*"]）会把 /API/ 等变体
# 导去 SPA 回退而绕过认证门的 401 契约；true 与原 Pages 中间件全量生效精确等价
run_worker_first = true

[observability]
enabled = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "navbase-db"
database_id = "be7711a1-76f4-4c81-80fc-36bd92168612"

[vars]
# 非敏感配置可放这里；ADMIN_USERNAME / ADMIN_PASSWORD 属于凭据，
# 本地开发放 .dev.vars（已 gitignore），线上用 `wrangler secret put` 配置
LOGIN_DURATION_DAYS = "7"
REMEMBER_DURATION_DAYS = "30"

# Worker Previews（分支预览构建）专用配置：预览环境不复用生产设置，
# 变量/绑定须在此单独声明；DB 指向独立预览库，避免未完成代码写坏生产数据。
# 预览登录凭据用 `wrangler preview secret put` 单独配置，勿放此处
[previews.vars]
LOGIN_DURATION_DAYS = "7"
REMEMBER_DURATION_DAYS = "30"

[[previews.d1_databases]]
binding = "DB"
database_name = "navbase-db-preview"
database_id = "30944c4c-3e8a-4c6d-8c9a-a90b769091c4"
